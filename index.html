<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex TG</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ============================================
     🎨 ЗОНА НАСТРОЙКИ ЦВЕТОВ — меняй только тут
     ============================================ */
  :root {
    color-scheme: light dark;

    /* base gradient colors (animated) */
    --g1: #6ee7b7;
    --g2: #8dd3ff;
    --g3: #c7a7ff;

    --accent-1: linear-gradient(90deg, var(--g1), var(--g2));
    --accent-2: linear-gradient(90deg, var(--g2), var(--g3));

    --bg-color: #060606;      /* фон приложения */
    --bg-glow-1: #1b1f24;     /* цветное пятно на фоне (левый верх) */
    --bg-glow-2: #0f1113;     /* цветное пятно на фоне (правый низ) */
    --card-bg: rgba(255,255,255,0.04);   /* фон карточек активов */
    --text-color: #ffffff;
    --hint-color: #9aa3b2;

    --gradient-speed: 8s;
  }
  /* ============================================ */

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: var(--tg-theme-text-color, var(--text-color));
    margin: 0;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    background-color: var(--tg-theme-bg-color, var(--bg-color));
    background-image:
      radial-gradient(circle at 12% 12%, var(--bg-glow-1) 0%, transparent 45%),
      radial-gradient(circle at 88% 88%, var(--bg-glow-2) 0%, transparent 45%);
    background-attachment: fixed;
  }

  /* Animated gradient helper */
  .animated-gradient {
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
    background-size: 300% 300%;
    animation: gradientShift var(--gradient-speed) linear infinite;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 22px;
    margin: 0 0 4px 0;
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift var(--gradient-speed) linear infinite;
    font-weight: 800;
  }
  .header p {
    color: var(--tg-theme-hint-color, var(--hint-color));
    font-size: 13px;
    margin: 0;
  }

  /* Вкладки категорий активов */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.03);
    padding: 4px;
    border-radius: 14px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--tg-theme-hint-color, var(--hint-color));
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    color: var(--bg-color);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    position: relative;
  }
  .tab.active::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    padding: 1px;
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
    -webkit-mask: linear-gradient(#000 0 0);
    filter: blur(0.4px);
    z-index: -1;
    background-size: 300% 300%;
    animation: gradientShift var(--gradient-speed) linear infinite;
  }

  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--tg-theme-hint-color, var(--hint-color));
    margin: 16px 0 8px 2px;
    font-weight: 700;
  }

  .asset-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .asset-card {
    padding: 14px 10px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1.2px solid transparent;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .asset-card .icon {
    font-size: 20px;
  }
  .asset-card .name {
    font-size: 14px;
    font-weight: 600;
  }
  .asset-card.selected {
    border-image: linear-gradient(90deg, var(--g1), var(--g2)) 1;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }

  .tf-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .tf-card {
    text-align: center;
    padding: 12px 4px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1.2px solid transparent;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .tf-card:hover { transform: translateY(-3px); }
  .tf-card.selected {
    border-image: linear-gradient(90deg, var(--g2), var(--g3)) 1;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
  }

  .submit-btn {
    margin-top: 16px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 16px;
    color: var(--bg-color);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    cursor: pointer;
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
    background-size: 300% 300%;
    animation: gradientShift var(--gradient-speed) linear infinite;
  }
  .submit-btn:active { transform: scale(0.99); }

  .scan-btn {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.06);
    background: transparent;
    color: var(--text-color);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .scan-btn:active { transform: scale(0.99); }

  .search-box {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1.5px solid rgba(255,255,255,0.06);
    color: var(--text-color);
    font-size: 14px;
    margin-bottom: 14px;
  }
  .search-box::placeholder { color: var(--hint-color); }
  .search-box:focus { outline: none; border-color: rgba(255,255,255,0.12); }

  .ticker-wrap {
    overflow: hidden;
    white-space: nowrap;
    background: rgba(255,255,255,0.02);
    border-radius: 10px;
    padding: 8px 0;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .ticker-track {
    display: inline-block;
    animation: ticker-scroll 25s linear infinite;
  }
  .ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 18px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--hint-color);
  }
  .ticker-item .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: linear-gradient(90deg, var(--g1), var(--g2));
  }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* Scan sheet */
  .scan-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    top: 40px;
    background: var(--bg-color);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 20px 20px 24px;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1);
    z-index: 60;
    border-top: 1px solid rgba(255,255,255,0.06);
    overflow-y: auto;
  }
  .scan-sheet.active { transform: translateY(0); }
  .scan-sheet .handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.12);
    margin: 0 auto 16px;
  }
  .scan-sheet h2 {
    font-size: 18px;
    font-weight: 800;
    margin: 0 0 4px 0;
    text-align: center;
  }
  .scan-sheet .scan-sub {
    text-align: center;
    font-size: 12.5px;
    color: var(--hint-color);
    margin-bottom: 18px;
  }
  #scanResultsList { display: grid; gap: 10px; }

  .scan-result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.03);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .scan-result-item:hover { transform: translateY(-4px); box-shadow: 0 14px 40px rgba(0,0,0,0.6); }
  .scan-result-item .left { display:flex; flex-direction:column; gap:4px; }
  .scan-result-item .name { font-size:15px; font-weight:800; color:var(--text-color); }
  .scan-result-item .meta { font-size:12px; color:var(--hint-color); }
  .scan-result-badge {
    padding: 8px 12px;
    border-radius: 12px;
    font-weight: 900;
    color: #fff;
    min-width: 80px;
    text-align: center;
    background: linear-gradient(90deg, rgba(15,191,111,0.95), rgba(10,143,82,0.95));
    background-size: 300% 300%;
    animation: gradientShift 6s linear infinite;
  }
  .scan-result-badge.sell {
    background: linear-gradient(90deg, rgba(255,95,109,0.95), rgba(200,30,58,0.95));
    animation: gradientShift 6s linear infinite;
  }

  .scan-empty {
    text-align: center;
    color: var(--hint-color);
    font-size: 14px;
    padding: 30px 10px;
  }

  /* loading screen */
  .loading-screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.6), rgba(0,0,0,0.7));
    z-index: 50;
    gap: 16px;
  }
  .loading-screen.active { display: flex; }

  .ring-loader {
    width: 120px;
    height: 120px;
    position: relative;
    margin-bottom: 8px;
  }
  .ring-loader::before,
  .ring-loader::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
  }
  .ring-loader::before {
    border-top-color: var(--g1);
    border-right-color: var(--g2);
    filter: drop-shadow(0 0 8px rgba(0,0,0,0.6));
    animation: ring-spin 1.2s linear infinite;
  }
  .ring-loader::after {
    inset: 12px;
    border-bottom-color: var(--g3);
    border-left-color: var(--g2);
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
    animation: ring-spin-rev 1.8s linear infinite;
  }
  @keyframes ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes ring-spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

  .loading-title { font-size: 17px; font-weight: 800; color:var(--text-color); }
  .loading-sub { font-size: 13px; color:var(--hint-color); min-height:18px; }

  .loading-progress { width: 80%; height: 8px; background: rgba(255,255,255,0.04); border-radius: 8px; overflow: hidden; }
  .loading-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--g1), var(--g2)); transition: width .24s linear; }

  /* result sheet (unchanged mostly) */
  .result-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg-color);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 24px 20px 28px;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1);
    z-index: 60;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
